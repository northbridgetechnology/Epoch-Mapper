# Epoch Mapper — standalone site.
#
# Local dev (build from source):
#   docker compose up -d --build
#
# Or run the CI-built image from GHCR (no build):
#   docker compose pull
#   docker compose up -d
#
# Then open http://localhost:3100

services:
  epoch-mapper:
    image: ghcr.io/northbridgetechnology/epoch-mapper:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epoch-mapper
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/about').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
