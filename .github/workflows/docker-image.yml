name: Build & publish site image

# Builds the standalone Epoch Mapper site and pushes it to the GitHub Container
# Registry (ghcr.io/northbridgetechnology/epoch-mapper). Multi-arch so it runs on
# both amd64 servers and Apple Silicon. No registry auth needed for the build —
# the site has no private dependencies.
#
# This is separate from the npm package publish (.github/workflows/publish.yml).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/epoch-mapper
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
